name: Update F1 Data

on:
  # Friday and Saturday: midnight SAST (22:00 UTC), after practice and qualifying.
  # Monday: 01:00 SAST (23:00 UTC Sunday). That is the weekly cache clear.
  schedule:
    - cron: '0 22 * * FRI,SAT'
    - cron: '0 23 * * SUN'
    # Later Monday catch-up for Americas races that finish after 01:00 SAST.
    - cron: '0 5 * * MON'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and update F1 data
        run: |
          node scripts/update-f1-data.js

      - name: Check for changes
        id: check-changes
        run: |
          git diff --exit-code docs/data/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git commit -m "Update F1 data - $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
